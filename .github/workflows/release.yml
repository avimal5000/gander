name: Release

# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0). macOS minutes bill at 10x on a private
# repo, so this runs only for tags. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  # For a tag whose push did not start the build (GitHub skips push workflows when the tagged commit's message contains
  # "[skip ci]", which a squash merge copies from the PR's commits): run this workflow on that tag from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Run this workflow on a vX.Y.Z tag, not on a branch." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Privacy guard
        run: scripts/privacy-guard.sh

      - name: SwayCore tests
        working-directory: SwayCore
        run: swift test

      # Without the signing secrets this step does nothing and the release is ad hoc signed (a Gatekeeper warning on
      # other Macs). With them, the app is signed with your Developer ID Application certificate.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" ]]; then
            echo "No signing certificate in the repository secrets: building an ad hoc signed release."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "The certificate is not a 'Developer ID Application' certificate." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--version "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --out dist)
          status="ad hoc signed only: other Macs show a Gatekeeper warning on first open (see the README)"
          if [[ -n "${SIGNING_IDENTITY:-}" ]]; then
            args+=(--identity "$SIGNING_IDENTITY")
            status="signed with a Developer ID certificate, not notarized"
            if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
              args+=(--notarize)
              status="signed and notarized by Apple"
            fi
          fi
          scripts/release.sh "${args[@]}"
          echo "SIGNING_STATUS=$status" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Gander $VERSION for macOS 14 or later (Apple silicon and Intel).

          **Build:** $SIGNING_STATUS.

          Open the DMG, drag Gander to Applications, and open it from there. If macOS says Apple could not verify the app
          (builds that are not notarized): click Done, then System Settings, Privacy & Security, scroll to Security,
          click Open Anyway next to "Gander was blocked", and confirm. Or run
          \`xattr -dr com.apple.quarantine /Applications/Gander.app\` in Terminal and open Gander again.

          Gander asks for Camera access when you set it up, and Accessibility access so it can focus windows. Gander never
          uses the network. The SHA-256 checksum is in the \`.sha256\` file.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "Gander $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --prerelease

      - name: Remove the signing keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
