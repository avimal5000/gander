name: Feature
description: Propose a new capability or change
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Works fully on-device with no network access
          required: true
